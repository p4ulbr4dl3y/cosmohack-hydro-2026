[project]
name = "cosmohack-hydro-2026"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "gdown>=6.4.0",
    "geopandas>=1.1.4",
    "numpy>=2.5.3",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "planetary-computer>=1.0.0",
    "pypdf>=6.19.0",
    "pystac-client>=0.9.0",
    "pyyaml>=6.0.3",
    "rasterio>=1.5.1",
    "scipy>=1.18.1",
    "shapely>=2.1.2",
    "uvicorn>=0.53.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "ignore::starlette.testclient.StarletteDeprecationWarning",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008", "C901", "B904", "B006"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E402", "F401", "W605", "I001"]

